name: Build ARTEX (manual)

# ARTEX is built from its own upstream repository (tracking main by default) rather
# than from this repo's image chain, so it is NOT part of the full-build workflows.
# It rebuilds only when you dispatch it by hand (optionally pinning a ref), or when
# the thin RF-Swift wrapper around it changes. Upstream-main drift needs a manual run.

env:
  REGISTRY_IMAGE: penthertz/rfswiftdev_resolute
  CACHE_REPO: penthertz/rfswiftdev_resolute
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      artex_ref:
        description: 'Upstream ARTEX ref to build (branch, tag or commit SHA)'
        type: string
        default: 'main'
  push:
    branches:
      - ubuntu_resolute
    paths:
      - 'Dockerfiles/artex.docker'
      - 'extras/artex/**'
      - '.github/workflows/build_artex.yml'

jobs:
  artex:
    runs-on: ubuntu-26.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Resolve ARTEX ref
        id: ref
        run: echo "artex_ref=${{ github.event.inputs.artex_ref || 'main' }}" >> $GITHUB_OUTPUT

      - name: Clear stale Docker credentials
        run: |
          rm -f ~/.docker/config.json
          mkdir -p ~/.docker

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # make artex builds the upstream ARTEX base straight from its git context, then
      # adds the embedded-PostgreSQL layer; both are pushed as :artex_base_<arch> / :artex_<arch>.
      - name: Build and push ARTEX image (${{ matrix.platform }}, ref ${{ steps.ref.outputs.artex_ref }})
        run: |
          cd Dockerfiles
          STORAGE_TYPE=registry ARCH=${{ matrix.platform }} \
            CACHE_REPO=${{ env.CACHE_REPO }} REGISTRY_IMAGE=${{ env.REGISTRY_IMAGE }} \
            ARTEX_REF=${{ steps.ref.outputs.artex_ref }} \
            make artex

  artex-manifest:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    needs: artex
    steps:
      - name: Clear stale Docker credentials
        run: |
          rm -f ~/.docker/config.json
          mkdir -p ~/.docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest for artex
        run: |
          tagname=artex
          output_amd64=$(docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${tagname}_amd64)
          arch_digest_amd64=$(echo "$output_amd64" | grep "vnd.docker.reference.digest:" | awk '{print $2}')
          output_arm64=$(docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${tagname}_arm64)
          arch_digest_arm64=$(echo "$output_arm64" | grep "vnd.docker.reference.digest:" | awk '{print $2}')
          echo "amd64 digest: $arch_digest_amd64"
          echo "arm64 digest: $arch_digest_arm64"
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY_IMAGE }}:$tagname \
            ${{ env.REGISTRY_IMAGE }}:${tagname}_amd64@$arch_digest_amd64 \
            ${{ env.REGISTRY_IMAGE }}:${tagname}_arm64@$arch_digest_arm64
