name: Tagged Release - Retag RISCV64

env:
  DEV_REGISTRY: penthertz/rfswiftdev_noble
  RELEASE_REGISTRY: penthertz/rfswift_noble
  ARCH: riscv64

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  retag-corebuild:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag corebuild
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          
          # Create versioned tag
          docker buildx imagetools create \
            --tag ${{ env.RELEASE_REGISTRY }}:corebuild_${VERSION}_${{ env.ARCH }} \
            ${{ env.DEV_REGISTRY }}:corebuild_${{ env.ARCH }}
          
          # Create latest tag
          docker buildx imagetools create \
            --tag ${{ env.RELEASE_REGISTRY }}:corebuild_${{ env.ARCH }} \
            ${{ env.DEV_REGISTRY }}:corebuild_${{ env.ARCH }}

  retag-sdrsa_devices:
    runs-on: ubuntu-22.04
