name: Tagged Release Build - AMD64

env:
  RELEASE_REGISTRY: penthertz/rfswift_noble_test
  PLATFORM: linux/amd64

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

jobs:
  build-corebuild:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push corebuild AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfiles/corebuild/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ env.RELEASE_REGISTRY }}:corebuild_${{ steps.get_version.outputs.version }}_amd64
            ${{ env.RELEASE_REGISTRY }}:corebuild_amd64
          cache-from: type=registry,ref=${{ env.RELEASE_REGISTRY }}:corebuild_amd64
          cache-to: type=inline

  build-sdrsa_devices:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: build-corebuild
