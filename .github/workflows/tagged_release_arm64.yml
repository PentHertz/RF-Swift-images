name: Tagged Release Build - ARM64

env:
  DEV_REGISTRY: penthertz/rfswiftdev_noble
  RELEASE_REGISTRY: penthertz/rfswift_noble_test

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

jobs:
  retag-corebuild:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag corebuild ARM64 image
        run: |
          tagname=corebuild
          arch=arm64
          version=${{ steps.get_version.outputs.version }}
          
          docker pull ${{ env.DEV_REGISTRY }}:${tagname}_${arch}
          docker tag ${{ env.DEV_REGISTRY }}:${tagname}_${arch} \
                     ${{ env.RELEASE_REGISTRY }}:${tagname}_${arch}_${version}
          docker push ${{ env.RELEASE_REGISTRY }}:${tagname}_${arch}_${version}
          docker tag ${{ env.DEV_REGISTRY }}:${tagname}_${arch} \
                     ${{ env.RELEASE_REGISTRY }}:${tagname}_${arch}
          docker push ${{ env.RELEASE_REGISTRY }}:${tagname}_${arch}

