          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push reversing ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfiles/reversing/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ env.RELEASE_REGISTRY }}:reversing_${{ steps.get_version.outputs.version }}_arm64
            ${{ env.RELEASE_REGISTRY }}:reversing_arm64
          cache-from: type=registry,ref=${{ env.RELEASE_REGISTRY }}:reversing_arm64
          cache-to: type=inline
          build-args: |
            BASE_IMAGE=${{ env.RELEASE_REGISTRY }}:corebuild_${{ steps.get_version.outputs.version }}_arm64