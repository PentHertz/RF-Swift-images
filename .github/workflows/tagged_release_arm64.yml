name: Tagged Release - Verified ARM64

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: image-release-arm64
  cancel-in-progress: false

env:
  DEV_REGISTRY: penthertz/rfswiftdev_resolute
  RELEASE_REGISTRY: penthertz/rfswift_resolute
  ARCH: arm64

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify revision and promote immutable digests
        run: bash .github/scripts/promote-images.sh corebuild sdrsa_devices sdrsa_devices_antsdr sdr_light sdr_gnuradio4 hardware deeptempest sdr_full telecom_utils telecom_2Gto3G telecom_4G_5GNSA telecom_5G_bladerf telecom_5G network wifi bluetooth rfid automotive android osint ad reversing
